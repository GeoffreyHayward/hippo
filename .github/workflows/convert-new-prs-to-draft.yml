name: Convert new PRs to draft

on:
  pull_request:
    types: [opened]

jobs:
  convert:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Convert to draft
        run: |
          gh pr ready ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --undo

      - name: PrintPR Process Message
        run: |
          gh pr review ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --request-changes \
            --body "## Pull Request Process

1. **All automated tests must pass**  
   - Ensure the CI pipeline is green before moving forward.

2. **All PR conversations must be marked as resolved**  
   - Every comment thread should be closed or clarified.

3. **A tester must mark the PR as “Ready for review”**  
   - This indicates testing is complete and the PR can undergo final checks.

4. **A developer must review and approve**  
   - This can happen before or after the PR is “Ready,” but final approval is required.

By following these steps, we keep our process consistent and ensure high-quality merges."
